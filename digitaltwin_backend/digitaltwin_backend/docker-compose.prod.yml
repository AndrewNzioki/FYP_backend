services:
  # 1. The Production Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super_secure_password_here
      POSTGRES_DB: digitaltwin_live
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always

  # 2. The Message Broker
  redis:
    image: redis:6-alpine
    restart: always

  # 3. Your Cloud Dashboard
  app:
    build: .
    command: ./start.sh
    ports:
      # This maps standard internet traffic (Port 80) to your app
      - "80:8000"
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always

  # 4. The Background Worker
  worker:
    build: .
    command: celery -A digitaltwin_backend worker --loglevel=info --concurrency=1
    env_file:
      - .env.prod
    depends_on:
      - redis
      - db
    restart: always

  # 5. The MQTT Listener
  mqtt:
    build: .
    command: python manage.py run_mqtt
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data_prod: