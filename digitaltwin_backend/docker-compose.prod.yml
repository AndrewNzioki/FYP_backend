services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod

  redis:
    image: redis:7-alpine
    restart: always

  app:
    build: .
    # Daphne runs on port 80 for production web traffic
    command: daphne -b 0.0.0.0 -p 80 --proxy-headers digitaltwin_backend.asgi:application
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  mqtt_worker:
    build: .
    # Runs your custom MQTT listener
    command: python manage.py run_mqtt
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env.prod
    depends_on:
      - db

volumes:
  postgres_data:
  caddy_data:
  caddy_config: